services:
  - type: web
    name: rill-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rill-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Must be set manually in Render dashboard

databases:
  - name: rill-db
    plan: free
