workflows:
  android-apk:
    name: Rill Android APK (Production)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        EXPO_PUBLIC_API_BASE_URL: "https://rill-app.onrender.com/api"
        # Add EXPO_TOKEN to Codemagic environment variables for automated login
      node: 20
    cache:
      cache_paths:
        - $CM_BUILD_DIR/mobile/node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Install EAS CLI
        script: |
          npm install -g eas-cli
      - name: Run Expo Prebuild
        script: |
          cd mobile
          # This generates the /android folder for the local build
          npx expo prebuild --platform android --no-install
      - name: Build Android APK (Local)
        script: |
          cd mobile/android
          ./gradlew assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com # Change this to your email
        notify:
          success: true
          failure: true
