workflows:
  android-build:
    name: Rill Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - rill_vars # Create this group in Codemagic UI and add EXPO_TOKEN
      vars:
        EXPO_PUBLIC_API_BASE_URL: "https://rill-app.onrender.com/api"
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Install EAS CLI
        script: |
          npm install -g eas-cli
      - name: Run Expo Prebuild
        script: |
          cd mobile
          npx expo prebuild
      - name: Build Android APK
        script: |
          cd mobile/android
          ./gradlew assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com # Update this
        notify:
          success: true
          failure: true
